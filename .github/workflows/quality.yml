name: Browser-Prüfkette
# Dieselbe Kette wie lokal (npm test): Syntax, echte Browserproben in Chromium, Sprachen, Worker, Vorräte.
# Bis 2026-10-26 lief sie nur lokal; der Vorrats-Befund (Workflow-PDF #131) hätte sie hier gefunden.
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - run: npx playwright-core install --with-deps chromium
      - run: sudo apt-get update && sudo apt-get install -y fonts-freefont-ttf fonts-roboto-unhinted fonts-dejavu-core
      - run: npm test
