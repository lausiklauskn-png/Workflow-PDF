<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Workfloh PDF — Formulare einlesen, Felder setzen, als PDF ausgeben</title>
<meta name="description" content="Workflow PDF: PDFs oder fotografierte Papierformulare einlesen, Formularfelder per KI erkennen lassen oder selbst setzen und als festes oder ausfüllbares PDF ausgeben. Offline, ohne Konto.">
<meta name="theme-color" content="#E0231B">
<!-- Versionsnummer (Klaus 2026-10-22): EINE Quelle für Fuß und Einstellungen. data-cache = CACHE_VERSION in sw.js;
     wer den Cache erhöht, erhöht auch die Version (tests/version.mjs, gleich mit package.json). -->
<meta name="wfp-version" content="1.1.5" data-cache="workfloh-pdf-v110">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Workfloh PDF">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png?v=1">
<link rel="icon" type="image/png" sizes="64x64" href="icons/favicon-64.png?v=1">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=1">
<!-- SBKIM-Knoten (2026-10-13): Modul 01 liest die Schublade BEIM LADEN — deshalb steht sie hier, vor allem anderen. Nie ändern. -->
<script>window.SBKIM_DB_SUFFIX = "workflowpdf";</script>
<!-- Teilen (Klaus 2026-10-21, „405 Not Allowed"): Android schickt eine geteilte Datei als POST an ./teilen-empfang.
     Nur der Worker nimmt sie an; fehlt er, antwortet GitHub Pages mit 405. Deshalb wird er hier SOFORT angemeldet,
     nicht erst am Ende von app.js (nach allen Skripten) — wie Mein-WorkFloh #253 und Kim-sync #17. -->
<script>if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(function(){});</script>
<link rel="stylesheet" href="assets/style.css?v=46">
<!-- Lighthouse 2026-10-11: Skripte laufen mit defer, die Seite malt vorher. Wer eine andere Sprache als Deutsch
     gewählt hat, sieht die Seite erst nach der Übersetzung (sprache.js nimmt die Marke weg) — kein deutsches Aufblitzen. -->
<script>try{var l=JSON.parse(localStorage.getItem('wfpdf_sprache_v1')||'{}').lang;if(l&&l!=='de'){var h=document.documentElement;h.setAttribute('data-ue-wartet','');if(l==='ar')h.dir='rtl';setTimeout(function(){h.removeAttribute('data-ue-wartet')},4000)}}catch(e){}</script>
<style>html[data-ue-wartet] body{visibility:hidden}</style>
</head>
<body>
<header class="kopf">
  <button class="floh-knopf" id="flohKnopf" aria-label="Zur Bibliothek" title="Zur Bibliothek">
    <span class="floh" id="floh" aria-hidden="true"></span>
  </button>
  <div class="marke">
    <div class="marke-name" data-kein-ue>Workfloh <b>PDF</b></div>
    <div class="marke-sub" id="kopfSub">Formulare einlesen · Felder setzen · übersetzen · PDF ausgeben</div>
  </div>
  <!-- SBKIM-Knoten: Lampen, Siegel, Mycel-Blase. Breit steht die Leiste vor den Knöpfen; am Handy (≤ 480 px)
       hängt sie als Lasche unter der Kopfzeile, damit „Workfloh PDF" bei 320 px ganz dasteht. -->
  <div class="netzleiste" id="netzleiste" data-offen="0">
    <button class="lampen" id="lampen" type="button" aria-expanded="false" aria-controls="netz-mehr" title="SBKIM-Knoten: lebt · verkehr · fremd — tippen zeigt Siegel und Netz">
      <span class="lamp" id="lamp-alive" title="lebt — eigene Identität geladen"><span class="lamp-t">lebt</span></span>
      <span class="lamp" id="lamp-traffic" title="verkehr — grün, solange am Relais gelauscht wird"><span class="lamp-t">verkehr</span></span>
      <span class="lamp" id="lamp-fremd" title="fremd — rot nur bei echtem Fremdzugriff"><span class="lamp-t">fremd</span></span>
    </button>
    <span class="netz-mehr" id="netz-mehr">
      <span class="lampen-legende" aria-hidden="true"><span class="lamp" data-lampe-kopie="lamp-alive">lebt</span><span class="lamp" data-lampe-kopie="lamp-traffic">verkehr</span><span class="lamp" data-lampe-kopie="lamp-fremd">fremd</span></span>
      <span class="siegel-platz" id="siegel-platz" data-kein-ue></span>
      <span class="mycel-platz" data-sbkim-mycel-platz data-kein-ue></span>
    </span>
  </div>
  <div class="kopf-rechts">
    <button class="knopf klein rot" id="btnInstall" title="Als App auf dieses Gerät legen">📲<span class="lang"> Installieren</span></button>
    <button class="ikon sprache-k" id="btnSprache" title="Sprache der App"><span data-kein-ue>DE</span></button>
    <button class="ikon" id="btnNeu" title="Neueste Fassung laden (Hard-Reload) — deine Dokumente bleiben">⟳</button>
    <button class="ikon" id="btnVideo" title="Erklärvideo" aria-label="Erklärvideo">🎬</button>
    <button class="ikon" id="btnHilfe" title="So geht's">?</button>
    <button class="ikon" id="btnEinst" title="Einstellungen">⚙️</button>
  </div>
</header>

<main id="app">
  <!-- Bibliothek -->
  <section id="sc-bib" class="screen on">
    <div class="import-leiste">
      <label class="gross-knopf rot">
        <input type="file" id="inDatei" accept="application/pdf,image/*,.json,application/json" multiple hidden>
        <span class="gk-ico">📄</span><span class="gk-t">PDF oder Bild<br><small>aus dem Dateiordner · auch Arbeitsstand</small></span>
      </label>
      <button class="gross-knopf" id="btnScan" type="button">
        <span class="gk-ico">📷</span><span class="gk-t">Scannen · Foto → PDF<br><small>zuschneiden · Filter · Text ändern</small></span>
      </button>
      <label class="gross-knopf">
        <input type="file" id="inOrdner" webkitdirectory multiple hidden>
        <span class="gk-ico">🗂️</span><span class="gk-t">Ganzen Ordner einlesen<br><small>alle PDFs und Bilder darin</small></span>
      </label>
      <button class="gross-knopf" id="btnUebersetzen" type="button">
        <span class="gk-ico">🌐</span><span class="gk-t">Importieren zum Übersetzen<br><small>neue Datei einlesen · Deutsch · Русский · English</small></span>
      </button>
    </div>

    <div class="ordner-leiste" id="ordnerLeiste"></div>
    <!-- Suchzeile (Klaus 2026-09-26): ein FORMULAR, damit die Lupe der Bildschirmtastatur absendet;
         im Feld Mikrofon und Lupe statt des Kreuzes des Browsers. -->
    <form class="bib-suchform" id="bibForm" role="search" autocomplete="off">
      <input class="bib-suche" id="bibSuche" type="search" enterkeyhint="search" placeholder="Suchen — Name oder Inhalt, z. B. eine Kundennummer" aria-label="Dokumente suchen">
      <button class="bib-knopf" id="bibMic" type="button" title="Sprechen statt tippen" aria-label="Spracheingabe">🎤</button>
      <button class="bib-knopf" id="bibLos" type="submit" title="Suchen" aria-label="Suchen">🔍</button>
    </form>
    <!-- Bildbeschreibung (Sitzung 4, 2026-10-26): EINE flache Zeile — Schalter „nur beschriebene Fotos", ⓘ, Modell laden/Stand; die Erklärung darunter (anfangs offen, gemerkt) -->
    <div class="bild-zeilen" id="bildZeilen"><div class="bild-filter-zeile" id="bildFilterZeile"></div><div class="bild-leiste" id="bildLeiste" data-bild-zustand="aus"></div></div>
    <!-- Suche nach Bedeutung (Stufe 2): Knopf zum Einschalten, Ladebalken, Zustand -->
    <div class="bedeutung-leiste" id="bedeutungLeiste" data-bed-zustand="aus"></div>
    <!-- Erinnerung an die Sicherung (Klaus 2026-10-02) — nur bei eigenen Dokumenten und alter/fehlender Sicherung -->
    <div class="sicherung-erinnerung" id="sicherungErinnerung" data-sicherung-erinnerung hidden></div>
    <div class="ordner-aktionen" id="ordnerAktionen"></div>
    <div class="wahl-leiste" id="wahlLeiste" hidden></div>
    <!-- „Alle prüfen" (Klaus 2026-10-22): nur sichtbar, wenn es ungeprüfte Dokumente gibt -->
    <div class="pruef-alle" id="pruefAlle" data-pruef-alle hidden></div>
    <div class="dok-gitter" id="dokGitter"></div>
    <!-- Impressum & Datenschutz sichtbar unter der Bibliothek (Klaus 2026-09-27: „damit ich die Apps ausliefern kann") -->
    <p class="rechtfuss" id="rechtFuss"><a href="impressum.html" target="_blank" rel="noopener">Impressum &amp; Datenschutz</a></p>
    <p class="rechtfuss-version" id="versionFuss" data-wfp-version hidden></p>
  </section>

  <!-- Editor -->
  <section id="sc-ed" class="screen">
    <div class="ed-leiste">
      <button class="knopf" id="edZurueck" title="Zurück zur Bibliothek">←<span class="lang"> Bibliothek</span></button>
      <input class="ed-name" id="edName" aria-label="Dokumentname">
      <div class="modus" role="tablist">
        <button id="mBearbeiten" class="modus-k on" role="tab">✏️ <span class="lang">Felder </span>bearbeiten</button>
        <button id="mAusfuellen" class="modus-k" role="tab">✍️ Ausfüllen</button>
      </div>
      <button class="knopf" id="edErkennen" title="Formularfelder erkennen lassen">🤖<span class="lang"> Felder</span> erkennen</button>
      <button class="knopf" id="edZuschneiden" title="Zuschneiden, gerade ziehen, Seitengröße wählen">✂️<span class="lang"> Zuschneiden</span></button>
      <span id="edPruefung" class="ed-pruefung" hidden></span>
      <button id="edBrief" class="ed-pruefung ed-brief" type="button" hidden>Briefkopf</button>
      <div class="zoom"><button class="knopf klein" id="zMinus" title="Kleiner">−</button><button class="knopf klein" id="zPlus" title="Größer">+</button></div>
      <button class="knopf" id="edSpeichern" title="Speichern · Arbeitsstand als Datei sichern">💾<span class="lang"> Speichern</span></button>
      <button class="knopf" id="edTeilen" title="Teilen mit … (E-Mail, Messenger …)">📤<span class="lang"> Teilen</span></button>
      <button class="knopf rot" id="edExport">⬇ PDF<span class="lang"> ausgeben</span></button>
    </div>
    <!-- Im Dokument suchen (Klaus 2026-09-26): wie die Suche im PDF-Programm — alle Treffer markiert,
         ▲▼ springt, ein Tipp auf eine Markierung blendet sie aus. -->
    <form class="ed-such" id="edSuchForm" role="search" autocomplete="off">
      <input class="bib-suche" id="edSuche" type="search" enterkeyhint="search" placeholder="🔎 Im Dokument suchen" aria-label="Im Dokument suchen">
      <span class="ed-such-zahl" id="edSuchZahl" aria-live="polite"></span>
      <button class="knopf klein" id="edSuchZurueck" type="button" title="Vorheriger Treffer">▲</button>
      <button class="knopf klein" id="edSuchWeiter" type="submit" title="Nächster Treffer">▼</button>
    </form>
    <!-- Bildbeschreibung im Editor (Sitzung 4): nur bei Fotos -->
    <div class="ed-bild" id="edBild" hidden></div>
    <div class="vorschlag-band" id="vorschlagBand" hidden></div>
    <div class="ed-flaeche" id="edFlaeche"><div class="seiten" id="seiten"></div></div>
    <div class="ed-fuss" id="edFuss"></div>
  </section>
</main>

<input type="file" id="inAnhang" accept="application/pdf,image/*" multiple hidden>
<input type="file" id="inUeOrdner" webkitdirectory multiple hidden>
<input type="file" id="inUeDateien" accept="application/pdf,image/*" multiple hidden>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<div id="modals"></div>

<script defer src="vendor/pdfjs/pdf.min.js"></script>
<script defer src="vendor/qrcode.js"></script>
<script defer src="assets/db.js?v=6"></script>
<script defer src="assets/suche.js?v=2"></script>
<script defer src="assets/bedeutung.js?v=2"></script>
<script defer src="assets/zip.js?v=1"></script>
<script defer src="assets/erkennung.js?v=5"></script>
<script defer src="assets/blatt.js?v=1"></script>
<script defer src="assets/scan-bild.js?v=7"></script>
<script defer src="assets/scanner.js?v=13"></script>
<script defer src="assets/export.js?v=7"></script>
<script defer src="assets/html-export.js?v=2"></script>
<script defer src="assets/uebersetzung.js?v=13"></script>
<!-- Strichgrafiken (Pro-Umbau 5) VOR sprache.js: ihr Beobachter läuft vor dem der Übersetzung -->
<script defer src="assets/strich.js?v=1"></script>
<script defer src="assets/sprache-texte.js?v=50"></script>
<script defer src="assets/sprache.js?v=4"></script>
<script defer src="assets/sprechen.js?v=3"></script>
<script defer src="assets/briefkopf.js?v=1"></script>
<script defer src="assets/briefkopf-ansicht.js?v=1"></script>
<script defer src="assets/bildbeschreibung.js?v=2"></script>
<script defer src="assets/schieber.js?v=1"></script>
<script defer src="assets/eingang.js?v=5"></script>
<script defer src="assets/reinigung.js?v=1"></script>
<script defer src="assets/schluesseltresor.js?v=1"></script>
<script defer src="assets/sicherung.js?v=3"></script>
<script defer src="assets/netz.js?v=1"></script>
<script defer src="assets/app.js?v=73"></script>
<!-- pdf-lib erst NACH app.js: die App wird nur zum Ausgeben gebraucht (kein Aufruf beim Start), so steht die Bibliothek früher da -->
<script defer src="vendor/pdf-lib.min.js"></script>
<!-- SBKIM-Knoten (2026-10-13): Lampen, Siegel, Mycel-Blase. Die Module lädt sbkim-init.js erst nach dem Laden in einer Leerlauf-Pause; beim Laden geht nichts ins Netz. -->
<script defer src="assets/sbkim-init.js?v=1"></script>
</body>
</html>
